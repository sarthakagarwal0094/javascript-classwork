<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id ="bulb" src="lamp_off.png">
    <br>
    <button id="on" type="button" onclick="trunon()">Turn On</button>
    <button id="off" type="button" onclick="trunoff()">Turn off</button>
</body>
</html>
<script>
    function trunon(){
        document.getElementById("bulb").src="lamp_on.png"
    }
    function trunoff(){
        document.getElementById("bulb").src="lamp_off.png"
    }
</script>
